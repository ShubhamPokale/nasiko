# nasiko-tool-compact

A compact, fail-closed encoder/decoder for tool definitions and tool calls.

## API

- `encode_tools(tools: &[ToolDef]) -> Result<CompactTools>`
- `decode_calls(text: &str, tools: &[ToolDef]) -> Result<Vec<ToolCall>>`
- `StreamDecoder` for chunked streaming output

## Grammar

The compact format uses:

```text
<<call tool_name {"json":"args"}>>
```

The decoder validates the tool name as well as the arguments against the original schema. Unknown tools, missing required fields, and enum violations produce errors instead of guesses.

## Scope and limits

This initial slice intentionally focuses on compact function-signature rendering and validation of structured tool arguments. It is designed to be pure-library and independent of the router.

## Example

```rust
use nasiko_tool_compact::{encode_tools, decode_calls, ToolDef};
use serde_json::json;

let tools = vec![ToolDef {
    name: "create_calendar_event".to_string(),
    description: Some("Create an event in the user's calendar.".to_string()),
    parameters: Some(json!({
        "type": "object",
        "properties": {
            "title": {"type": "string"},
            "start": {"type": "string"},
            "duration_min": {"type": "integer"},
            "visibility": {"type": "string", "enum": ["public", "private"]}
        },
        "required": ["title", "start"]
    })),
}];

let compact = encode_tools(&tools).unwrap();
let text = "<<call create_calendar_event {\"title\":\"Design review\",\"start\":\"2026-10-05T15:00:00+05:30\"}>>";
let calls = decode_calls(text, &tools).unwrap();
assert_eq!(calls[0].name, "create_calendar_event");
```

